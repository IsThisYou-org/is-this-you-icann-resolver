server:
	interface: 0.0.0.0
	port: 53
	do-ip4: yes
	do-ip6: no
	do-udp: yes
	do-tcp: yes
	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow_snoop
	access-control: 10.0.0.0/8 allow_snoop
	access-control: 172.16.0.0/12 allow_snoop
	access-control: 192.168.0.0/16 allow_snoop
	username: "unbound"
	chroot: "/opt/data/unbound"
	directory: "/opt/data/unbound"
	pidfile: ""
	logfile: ""
	use-syslog: yes
	verbosity: 1
	trust-anchor-file: "/opt/data/unbound/trusted-key.key"
	hide-identity: yes
	hide-version: yes
	control-use-cert: no
	extended-statistics: yes
	statistics-cumulative: yes   # Optional: prevents resetting counters after each log interval
	statistics-inhibit-zero: yes # Default: yes; hides zeroed extended counters

remote-control:
    control-enable: yes
    control-interface: /opt/data/unbound/unbound.ctl

auth-zone:
	name: "."
	# xfr.lax.dns.icann.org, xfr.cjr.dns.icann.org, c.root-servers.net, f.root-servers.net
	primary: 192.0.32.132
	primary: 192.0.47.132
	primary: 192.33.4.12
	primary: 192.5.5.241
	zonemd-check: yes
	for-downstream: no
	for-upstream: yes
	fallback-enabled: yes
	zonemd-reject-absence: yes
	zonefile: "/opt/data/unbound/root.zone"
